# Starship Prompt - Modern, minimal, informative
# Docs: https://starship.rs/config/

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$java\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# Faster prompt
command_timeout = 500
add_newline = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold purple)"

[directory]
style = "bold cyan"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 🔒"
home_symbol = "~"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

[nodejs]
symbol = " "
format = "[$symbol($version)]($style) "
detect_files = ["package.json", ".node-version"]
style = "bold green"

[python]
symbol = " "
format = "[$symbol($version)( \\($virtualenv\\))]($style) "
style = "bold yellow"

[rust]
symbol = "🦀 "
format = "[$symbol($version)]($style) "
style = "bold red"

[golang]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold cyan"

[java]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold red"

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "bold blue"
only_with_files = true
